[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "report-agent-system"
version = "0.1.0"
description = "Independent goal-driven report agent prototype"
requires-python = ">=3.12"
dependencies = ["python-dotenv==1.2.3", "tenacity==9.1.4", "deepagents==0.7.19", "langchain-openai==1.6.6", "langgraph-checkpoint-sqlite==3.1.1", "neo4j==6.3.1", "fastembed==0.8.1", "fastapi==0.141.1", "uvicorn==0.54.0", "python-docx==1.2.0", "openpyxl==3.1.5", "pypdf==6.19.0", "pypdfium2==5.13.0", "pdfplumber==0.11.10", "Pillow==12.3.0", "markdown-it-py==4.0.0", "jsonschema==4.26.0", "referencing==0.37.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pyright==1.1.414", "pytest-cov==7.1.0"]
historical-tests = ["google-adk==2.10.0", "litellm==1.102.1"]

[project.scripts]
report-agent = "report_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report_agent = ["static/*", "rules/*.md", "methods/*.json", "assertions/schema/*.json", "assertions/schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
